# Capture the virtual display for remote desktop streaming.
# KMS monitor list (check sunshine.log on startup):
#   0 = HDMI-A-1 (virtual)
#   1 = DP-3 (physical)
adapter_name = /dev/dri/renderD128
capture = kms
encoder = nvenc
output_name = 0

# Switch displays when a Moonlight session starts/stops.
global_prep_cmd = [{"do":"/home/mdj2812/bin/vdisplay-on.sh","undo":"/home/mdj2812/bin/vdisplay-off.sh"}]
