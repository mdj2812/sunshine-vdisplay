# Capture the virtual display for remote desktop streaming.
# KMS monitor list (check sunshine.log on startup):
#   0 = virtual display
#   1 = physical monitor
adapter_name = /dev/dri/renderD128
capture = kms
encoder = nvenc
output_name = 0

# install-local.sh rewrites __HOME__ to your home directory.
global_prep_cmd = [{"do":"__HOME__/bin/vdisplay-on.sh","undo":"__HOME__/bin/vdisplay-off.sh"}]
