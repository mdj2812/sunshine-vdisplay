name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shell:
    name: Shell lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          curl -sSfL https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64 \
            -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt

      - name: ShellCheck
        run: |
          shellcheck scripts/install.sh scripts/uninstall.sh scripts/install-local.sh scripts/vdisplay-common.sh
          (cd scripts && shellcheck -x vdisplay-on.sh vdisplay-off.sh)

      - name: shfmt
        run: shfmt -d -i 4 -ci -bn scripts/*.sh

      - name: bash -n
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

  edid:
    name: EDID generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate 256-byte EDID
        run: |
          python3 scripts/create-vdisplay-edid.py /tmp/virtual-display.bin
          test "$(wc -c < /tmp/virtual-display.bin)" -eq 256

  smoke:
    name: Install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 initramfs-tools sudo

      - name: Run smoke test
        run: sudo -E env HOME=/root ./tests/smoke-test.sh
