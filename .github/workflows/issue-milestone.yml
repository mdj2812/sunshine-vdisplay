name: Issue milestone

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  assign-amd-milestone:
    if: startsWith(github.event.issue.title, '[AMD]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const milestoneNumber = 2;
            try {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                milestone: milestoneNumber,
              });
              core.info(`Set milestone ${milestoneNumber} on issue #${context.issue.number}`);
            } catch (error) {
              core.warning(
                `Could not set milestone ${milestoneNumber} on issue #${context.issue.number}: ${error.message}`
              );
            }
